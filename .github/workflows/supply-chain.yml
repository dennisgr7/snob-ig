name: Supply chain

# Actions are pinned to a commit, not to a tag.
#
# A tag is a movable ref: whoever can push to the action's repository can point
# `v4` at different code tomorrow, and every workflow that names `v4` runs it
# without a diff anywhere. That is the shape of most of the CI supply-chain
# incidents of the last two years. `dtolnay/rust-toolchain@stable` was worse
# still -- `stable` is a *branch*, so it moved on every commit to it.
#
# The comment after each pin is the version it was, so a reader can see at a
# glance what is installed; `.github/dependabot.yml` is what moves them, and
# without it these rot.

# Its own file because of the schedule. `on:` is a property of the workflow, not
# of a job, so a weekly cron living in ci.yml started every job in ci.yml — the
# three-OS test matrix and the full five-target release build, every Monday,
# for a check that compiles nothing. Three `if: github.event_name != 'schedule'`
# guards would have worked and would have to be remembered by whoever adds the
# fourth job. A file whose only triggers are the ones this check needs cannot
# drift that way.
#
# The schedule is the point rather than a convenience: an advisory published on
# a Tuesday would otherwise turn somebody's unrelated Wednesday pull request red
# for the first time. Finding it on a timer means it is already known about by
# then.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  # Reads Cargo.lock against the advisory database. It compiles nothing and runs
  # in well under a minute.
  supply-chain:
    name: Advisories and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories sources
