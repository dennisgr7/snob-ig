name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  # For the advisory check only. See the note on that job.
  schedule:
    - cron: "17 6 * * 1"

env:
  CARGO_TERM_COLOR: always
  # A failed build should not be followed by a slow one.
  CARGO_INCREMENTAL: 0

# Nothing here writes anything back. Said explicitly rather than inherited,
# because these jobs compile third-party build scripts and a token they never
# use is one they cannot misuse.
permissions:
  contents: read

jobs:
  # Reads Cargo.lock against the advisory database. It compiles nothing and
  # runs in well under a minute, so it sits beside `lint` rather than in front
  # of the build.
  #
  # Also on a schedule, and that is the point of the schedule: an advisory
  # published on a Tuesday would otherwise turn somebody's unrelated Wednesday
  # pull request red for the first time. Finding it on a timer means it is
  # already known about by then.
  supply-chain:
    name: Advisories and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories sources

  lint:
    name: Format and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

      # The release regenerates the formula and the manifests in its very last
      # job, which is the most expensive place to learn that the generator is
      # broken -- it happened once, to a permission bit. Running it here proves
      # the script still works and that what is committed is what it produces,
      # so nobody can hand-edit a checksum into one of them either.
      - name: The packaged manifests are what the generator writes
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if ! curl -fsSL -o /tmp/SHA256SUMS \
            "https://github.com/${{ github.repository }}/releases/download/v$version/SHA256SUMS"; then
            echo "$version is not released yet, so there is nothing to render against"
            exit 0
          fi
          bash packaging/render.sh "$version" /tmp/SHA256SUMS
          git diff --exit-code -- Formula bucket packaging/winget

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The keyring backend differs on each of these, and so does the path
        # layout, so the suite has to run on all three rather than on one.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The tests use their own keyring service name and never touch the real
      # one, but on Linux there is no keyring daemon at all: without this, the
      # secret store falls back to a file and the backend under test is not the
      # one that ships.
      - name: Install a keyring service
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring dbus-x11
      - name: Test
        if: runner.os != 'Linux'
        run: cargo test --workspace
      # Against musl, which is what Linux users get. The same reasoning as the
      # keyring daemon above: a suite that passes on a build nobody receives
      # has not tested the thing that ships. This is where a musl-only problem
      # in TLS, DNS or SQLite would surface, because the tests drive all three.
      - name: Test with a session bus
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          dbus-run-session -- bash -c '
            echo "" | gnome-keyring-daemon --unlock --components=secrets
            cargo test --workspace --target x86_64-unknown-linux-musl
          '

  build:
    name: Build ${{ matrix.target }}
    # Only once a change has landed: six native builds on every pull request
    # buys very little over the three test runs above.
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          # Tier 1, and there are native runners for it, but it is not among
          # the targets release tooling covers by default.
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
          # musl, not gnu. A binary linked against the runner's glibc carries
          # its version as a hard requirement: built on Ubuntu 24.04 it refused
          # to install on Debian 12 and Ubuntu 22.04, which between them are
          # most of the Linux machines anyone actually has. musl links
          # statically and asks the host for nothing.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-latest
          # No x86_64-apple-darwin. The only runner that built it, macos-13,
          # was retired in December 2025, and a job asking for it does not
          # fail: it sits queued with no runner until the run is cancelled.
          # `macos-15-intel` would still work, but it is the last Intel image
          # Actions will offer and it goes away in August 2027, so adding it
          # buys a target with a known expiry date. Apple stopped selling
          # Intel Macs in 2023. Anyone still on one can build from source.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # rusqlite builds SQLite from C, so a musl target needs a musl C
      # compiler. Without this the failure is a linker error about missing
      # headers, which reads like a broken machine rather than a missing
      # package.
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - run: cargo build --release --target ${{ matrix.target }} -p snob-cli
      - name: Check the binary runs
        run: cargo run --release --target ${{ matrix.target }} -p snob-cli -- --version

      # Statically linked is a claim, and it is the whole reason for choosing
      # musl, so it gets checked rather than assumed: `ldd` on a static binary
      # reports no dynamic dependencies at all.
      - name: Check the Linux binary is static
        if: contains(matrix.target, 'musl')
        run: |
          file target/${{ matrix.target }}/release/snob
          ldd target/${{ matrix.target }}/release/snob 2>&1 | tee /tmp/ldd
          grep -q "not a dynamic executable\|statically linked" /tmp/ldd

      # The release workflow builds this too, and there `publish` needs `build`:
      # packaging metadata that no longer works would stop a release rather than
      # degrade it. One target is enough to catch that, and it costs nothing
      # here.
      - name: Check the Debian package builds
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          cargo install cargo-deb --locked
          # Down to the --output, this is the line the release runs. A check
          # that invokes something other than what it is guarding is not
          # guarding it, and the difference would only show during a release.
          cargo deb --no-build --no-strip -p snob-cli \
            --target ${{ matrix.target }} \
            --output "snob-v0.0.0-check.deb"
          dpkg-deb --info snob-v0.0.0-check.deb | head -12
          dpkg-deb --contents snob-v0.0.0-check.deb
