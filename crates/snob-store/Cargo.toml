[package]
name = "snob-store"
description = "snob-ig storage: the SQLite database, the platform directories, the keyring and the monitor's configuration file"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
snob-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize.workspace = true
directories.workspace = true
keyring-core.workspace = true
tracing.workspace = true
rusqlite.workspace = true
rusqlite_migration.workspace = true
# Reading the monitor's configuration file.
toml.workspace = true

# One credential store per platform, chosen here rather than by a wrapper crate.
# See the workspace manifest for what going direct bought, and `secrets.rs` for
# how the store is installed and why the Windows one is asked for local
# persistence.
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
base64.workspace = true
windows-native-keyring-store.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store.workspace = true

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
