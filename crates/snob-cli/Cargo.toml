[package]
name = "snob-cli"
description = "snob-ig command line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "snob_cli"
path = "src/lib.rs"

[[bin]]
name = "snob"
path = "src/main.rs"

# A build that can be driven end to end without Instagram.
#
# Off by default: `cargo build --release` produces a binary with neither the
# flags nor the code behind them. `cargo test --features testing` is what turns
# them on, and `crates/snob-cli/tests/sandbox.rs` is what they are for.
[features]
testing = ["snob-ig/testing"]

[dependencies]
snob-core.workspace = true
snob-ig.workspace = true
clap.workspace = true
tokio.workspace = true
anyhow.workspace = true
serde_json.workspace = true
dialoguer.workspace = true
console.workspace = true
indicatif.workspace = true
supports-hyperlinks.workspace = true
# `custom_styling` is what makes the width calculation look past the escape
# sequences an OSC 8 link puts around a username.
comfy-table = { workspace = true, features = ["custom_styling"] }
csv.workspace = true
rust_xlsxwriter.workspace = true
zip.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Already in the tree through snob-core, so this costs no extra compilation.
# Used so a typed sessionid does not sit in freed memory after the prompt that
# read it.
zeroize.workspace = true
# Already in the tree through snob-ig, where it jitters the pace between
# requests. Used here for the same reason at a larger scale: `snob watch` moves
# each scheduled run a little later, so the walks do not start on the same
# second every day. Not a security decision, so the fast generator is the right
# one — but the roll is made here and handed to `schedule::with_jitter`, which
# reads no randomness of its own and can therefore be tested.
fastrand.workspace = true
# Was a dev-dependency, for pointing the client at a mock server. Now also a
# real one: the monitor's webhook address is parsed and inspected before
# anything is posted to it, and `Url::host()` is what tells an IPv6 loopback
# from a domain -- the string form keeps the brackets the syntax requires, so
# `[::1]` does not parse as an address.
url.workspace = true

# Launching the browser with the debugging protocol on a pipe. Windows needs the
# handle-inheritance blob and the job object; Unix needs `dup2`. Neither is
# reachable through `std::process::Command`, and the reasoning is in
# `src/pipe.rs`.
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
wiremock.workspace = true
tempfile.workspace = true

# Enough for `apt install ./snob-*.deb` to work and `apt remove snob` to undo
# it. A signed apt repository would be the other half, and it needs a GPG key
# that only the maintainer can hold, so the loose package is what can be built
# without one. The maintainer address is the GitHub noreply one on purpose.
[package.metadata.deb]
name = "snob"
maintainer = "dennisgr7 <70021856+dennisgr7@users.noreply.github.com>"
section = "utils"
priority = "optional"
depends = "$auto"
extended-description = """
Walks an Instagram account's followers and following, crosses them, and reports \
who does not follow you back, who you never followed back, and who you and \
somebody else both know. Reads only: it never follows, unfollows, blocks or \
removes anyone."""
assets = [
    ["target/release/snob", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/snob/README.md", "644"],
    ["../../CHANGELOG.md", "usr/share/doc/snob/CHANGELOG.md", "644"],
]

[lints.rust]
# Linking this binary has made MSVC announce that it is creating an import
# library, because a native dependency exports symbols. There is nothing to act
# on, and it was the first thing printed on every build. Kept even though
# Windows no longer links aws-lc: the message belongs to the linker, not to any
# one dependency.
linker_messages = "allow"
