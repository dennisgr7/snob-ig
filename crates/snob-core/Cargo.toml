[package]
name = "snob-core"
description = "snob-ig domain: models, set arithmetic, diffing, schedules and the request-budget interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# **No I/O crate belongs in this list**, and that is the whole point of the
# split: `snob-ig` depends on this crate and on nothing under it, so an HTTP
# client no longer compiles SQLite, three keyring backends and a TOML parser it
# never calls. Anything that opens a file, a database or a credential store goes
# in `snob-store`.
[dependencies]
serde.workspace = true
thiserror.workspace = true
# Every credential field is a `Secret`, which clears itself on drop.
zeroize.workspace = true
# `clock`, and the calendar arithmetic the monitor's schedule is made of. Pure
# computation: no clock is read except in `clock`, so `schedule` can be tested
# against any moment.
chrono.workspace = true
# Putting a username inside a URL. Encoding rather than filtering, because
# filtering removes characters and a name with one removed is the address of a
# different account; the reasoning is on `User::profile_url`.
percent-encoding.workspace = true
# Signing the monitor's webhook body, so the receiver can tell a report from
# this tool apart from anything else that found the address. See the workspace
# manifest for why these two and not the obvious alternatives.
#
# Here rather than in `snob-store` although the monitor's *file* is over there:
# a signature is bytes and a key in, bytes out. It reads no clock and opens
# nothing, which is the test everything in this crate has to pass.
hmac.workspace = true
sha2.workspace = true

[dev-dependencies]
# Only to assert the wire form of what `serde` derives here: a model whose JSON
# shape changed silently is a report a receiver stops understanding.
serde_json.workspace = true

[lints]
workspace = true
