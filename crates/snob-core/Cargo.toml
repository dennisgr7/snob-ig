[package]
name = "snob-core"
description = "snob-ig domain: models, diffing, storage and notifications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize.workspace = true
chrono.workspace = true
directories.workspace = true
keyring-core.workspace = true
tracing.workspace = true
rusqlite.workspace = true
rusqlite_migration.workspace = true
percent-encoding.workspace = true
# Reading the monitor's configuration file.
toml.workspace = true
# Signing the monitor's webhook body, so the receiver can tell a report from
# this tool apart from anything else that found the address. See the workspace
# manifest for why these two and not the obvious alternatives.
hmac.workspace = true
sha2.workspace = true

# One credential store per platform, chosen here rather than by a wrapper crate.
# See the workspace manifest for what going direct bought, and `secrets.rs` for
# how the store is installed and why the Windows one is asked for local
# persistence.
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
base64.workspace = true
windows-native-keyring-store.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store.workspace = true

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store.workspace = true

[dev-dependencies]
tempfile.workspace = true
