[package]
name = "snob-ig"
description = "Instagram private API client: endpoints, pagination and rate control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
snob-core.workspace = true
tokio.workspace = true
fastrand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true

# Which TLS stack the client is built on, decided per platform.
#
# The two tables are mutually exclusive, so exactly one applies to any target
# and reqwest never ends up with both backends compiled in.
[target.'cfg(not(windows))'.dependencies]
reqwest = { workspace = true, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
reqwest = { workspace = true, features = ["native-tls"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
wiremock.workspace = true
